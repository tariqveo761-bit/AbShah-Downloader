name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]" yt-dlp imageio-ffmpeg

      - name: Build Android APK
        env:
          CI: "true"
          FLET_NON_INTERACTIVE: "true"
        run: |
          flet build apk --project "AbShahDownloader" --org "com.abshah.downloader" -vv

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AbShah-Downloader-APK
          path: build/apk/*.apk
