name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp imageio-ffmpeg

      - name: Build Android APK
        run: |
          yes y | flet build apk --project "AbShahDownloader" --org "com.abshah.downloader" -vv

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbShah-Downloader-APK
          path: build/apk/*.apk
